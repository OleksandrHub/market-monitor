@if (instrument && currentPrice) {
<div class="live-price__info">
    <p class="live-price__text">Symbol:</p>
    <p class="live-price__text">USD</p>
</div>
<div class="live-price__info">
    <p class="live-price__text">Price:</p>
    <p class="live-price__text">1.00</p>
</div>
<div class="live-price__info">
    <p class="live-price__text">Time:</p>
    <p class="live-price__text">00:00</p>
</div>
} @else {
<div class="live-price__info">
    <p class="live-price__text">Symbol:</p>
    <p class="live-price__text">N/A</p>
</div>
<div class="live-price__info">
    <p class="live-price__text">Price:</p>
    <p class="live-price__text">N/A</p>
</div>
<div class="live-price__info">
    <p class="live-price__text">Time:</p>
    <p class="live-price__text">N/A</p>
</div>
}
